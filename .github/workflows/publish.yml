name: Publish Release

on:
  workflow_dispatch:
    inputs:
      preflight_run_id:
        description: Successful Release Preflight run ID
        required: true
  workflow_run:
    workflows: ["Release Preflight"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Verified Release
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.preflight_run_id }}

      - name: Read and verify release candidate
        id: release
        run: |
          cd "$RUNNER_TEMP/release-candidate"
          sha256sum -c SHA256SUMS

          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const required = ['version', 'tag', 'commit_sha', 'clawhub_package', 'skillhub_package'];

            if (required.some((key) => !manifest[key])) {
              console.error('❌ Release candidate manifest is incomplete');
              process.exit(1);
            }

            for (const [key, value] of Object.entries(manifest)) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, key + '=' + value + '\n');
            }
          "

      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.commit_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate candidate identity
        id: tag
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.release.outputs.commit_sha }}"
          test "$(node -p "require('./package.json').version")" = "${{ steps.release.outputs.version }}"
          test "${{ steps.release.outputs.tag }}" = "v${{ steps.release.outputs.version }}"

          git fetch --tags
          if git rev-parse "${{ steps.release.outputs.tag }}" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "${{ steps.release.outputs.tag }}")

            if [ "$TAG_COMMIT" != "${{ steps.release.outputs.commit_sha }}" ]; then
              echo "❌ Git tag ${{ steps.release.outputs.tag }} points to $TAG_COMMIT, not the verified release commit."
              exit 1
            fi

            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ Existing tag ${{ steps.release.outputs.tag }} matches the verified release commit."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check GitHub release
        id: github-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOOKUP_OUTPUT=$(mktemp)

          if gh release view "${{ steps.release.outputs.tag }}" --repo "$GITHUB_REPOSITORY" > "$LOOKUP_OUTPUT" 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ GitHub Release ${{ steps.release.outputs.tag }} already exists and will be skipped."
          elif grep -qi "release not found" "$LOOKUP_OUTPUT"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$LOOKUP_OUTPUT"
            echo "❌ Unable to determine GitHub Release status."
            exit 1
          fi

      - name: Install ClawHub CLI
        run: npm install -g clawhub

      - name: Authenticate to ClawHub
        run: clawhub login --token "$CLAWHUB_TOKEN" --no-browser
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      - name: Verify ClawHub authentication
        run: clawhub whoami

      - name: Recheck ClawHub version
        id: clawhub-version
        run: |
          LOOKUP_OUTPUT=$(mktemp)

          if clawhub package inspect 8080ai --version "${{ steps.release.outputs.version }}" --json > "$LOOKUP_OUTPUT" 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️ ClawHub version ${{ steps.release.outputs.version }} already exists; publish is skipped."
          elif grep -q "Version not found" "$LOOKUP_OUTPUT"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "✅ ClawHub version ${{ steps.release.outputs.version }} remains available."
          else
            cat "$LOOKUP_OUTPUT"
            echo "❌ Unable to determine ClawHub version status."
            exit 1
          fi

      - name: Publish to ClawHub dry run
        if: steps.clawhub-version.outputs.exists != 'true'
        run: |
          clawhub package publish "$RUNNER_TEMP/release-candidate/${{ steps.release.outputs.clawhub_package }}" \
            --family code-plugin \
            --version "${{ steps.release.outputs.version }}" \
            --source-repo "${{ github.repository }}" \
            --source-commit "${{ steps.release.outputs.commit_sha }}" \
            --source-ref "${{ steps.release.outputs.tag }}" \
            --dry-run

      - name: Publish to ClawHub
        if: steps.clawhub-version.outputs.exists != 'true'
        run: |
          clawhub package publish "$RUNNER_TEMP/release-candidate/${{ steps.release.outputs.clawhub_package }}" \
            --family code-plugin \
            --version "${{ steps.release.outputs.version }}" \
            --source-repo "${{ github.repository }}" \
            --source-commit "${{ steps.release.outputs.commit_sha }}" \
            --source-ref "${{ steps.release.outputs.tag }}"

      - name: Verify ClawHub release
        run: |
          for ATTEMPT in 1 2 3 4 5 6; do
            if clawhub package inspect 8080ai --version "${{ steps.release.outputs.version }}" --json >/dev/null 2>&1; then
              echo "✅ Verified ClawHub version ${{ steps.release.outputs.version }}."
              exit 0
            fi

            echo "Waiting for ClawHub version ${{ steps.release.outputs.version }} (attempt $ATTEMPT/6)"
            sleep 10
          done

          echo "❌ ClawHub version ${{ steps.release.outputs.version }} was not found after publishing."
          exit 1

      - name: Extract verified SkillHub package
        run: |
          mkdir -p release-skillhub
          unzip -q "$RUNNER_TEMP/release-candidate/${{ steps.release.outputs.skillhub_package }}" -d release-skillhub
          test -f release-skillhub/ai8080/SKILL.md
          test -f release-skillhub/ai8080/.skillhub.json

      - name: Configure SkillHub token
        run: |
          mkdir -p "$HOME/.skillhub"
          node -e "
            const fs = require('fs');
            const authPath = process.env.HOME + '/.skillhub/auth.json';
            fs.writeFileSync(authPath, JSON.stringify({
              accessToken: process.env.SKILLHUB_TOKEN,
              user: { username: 'github-actions', email: '', tier: 'standard' }
            }, null, 2), { mode: 0o600 });
          "
        env:
          SKILLHUB_TOKEN: ${{ secrets.SKILLHUB_TOKEN }}

      - name: Verify SkillHub authentication
        run: npx -y @skill-hub/cli whoami

      - name: Recheck SkillHub semantic version
        id: skillhub-version
        env:
          SKILLHUB_TOKEN: ${{ secrets.SKILLHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
            import fs from 'node:fs';

            const apiRoot = 'https://www.skillhub.club/api';
            const configPath = 'release-skillhub/ai8080/.skillhub.json';
            const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
            const localContent = fs.readFileSync('release-skillhub/ai8080/SKILL.md', 'utf8');
            const releaseVersion = process.env.RELEASE_VERSION;

            const getVersion = (content) => {
              const frontmatter = content.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/);
              const versionLine = frontmatter?.[1]
                .split(/\r?\n/)
                .find((line) => line.startsWith('version:'));
              return versionLine?.slice('version:'.length).trim() ?? null;
            };
            const normalize = (content) => content.replace(/\r\n/g, '\n').trimEnd();

            if (getVersion(localContent) !== releaseVersion) {
              throw new Error(`Packaged SKILL.md version does not match ${releaseVersion}.`);
            }

            const request = async (endpoint) => {
              const response = await fetch(apiRoot + endpoint, {
                headers: { Authorization: `Bearer ${process.env.SKILLHUB_TOKEN}` }
              });

              if (!response.ok) {
                throw new Error(`SkillHub ${endpoint} returned HTTP ${response.status}.`);
              }

              return response.json();
            };

            const { skills = [] } = await request('/user/skills');
            const expectedName = config.name.toLowerCase();
            const matches = skills.filter((skill) => (
              skill.name?.toLowerCase() === expectedName ||
              skill.slug?.toLowerCase() === expectedName ||
              (config.slug && skill.slug?.toLowerCase() === config.slug.toLowerCase())
            ));

            if (matches.length > 1) {
              throw new Error(`Multiple SkillHub skills match "${config.name}".`);
            }

            if (matches.length === 0) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'exists=false\n');
              console.log(`No existing SkillHub skill named "${config.name}"; push will create it.`);
              process.exit(0);
            }

            const skill = matches[0];
            const { versions = [] } = await request(`/user/skills/${encodeURIComponent(skill.id)}/versions`);
            let existingContent = null;
            let existingInternalVersion = null;

            for (const remoteVersion of versions) {
              const pulled = await request(
                `/user/skills/${encodeURIComponent(skill.id)}/pull?version=${encodeURIComponent(remoteVersion.version)}`
              );
              const skillFile = pulled.files?.find((file) => file.filepath === 'SKILL.md');

              if (skillFile && getVersion(skillFile.content) === releaseVersion) {
                existingContent = skillFile.content;
                existingInternalVersion = remoteVersion.version;
                break;
              }
            }

            fs.writeFileSync(configPath, JSON.stringify({
              ...config,
              skill_id: skill.id,
              slug: skill.slug
            }, null, 2));

            if (existingContent) {
              if (normalize(existingContent) !== normalize(localContent)) {
                throw new Error(
                  `SkillHub semantic version ${releaseVersion} already exists with different content.`
                );
              }

              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'exists=true\n');
              console.log(
                `SkillHub semantic version ${releaseVersion} already exists as internal version ${existingInternalVersion} ` +
                `with matching content; push is skipped and publishing resumes.`
              );
              process.exit(0);
            }

            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'exists=false\n');
            console.log(`Linked existing SkillHub skill ${skill.slug}; ${releaseVersion} remains available.`);
          NODE

      - name: Push SkillHub skill
        if: steps.skillhub-version.outputs.exists != 'true'
        working-directory: release-skillhub/ai8080
        run: npx -y @skill-hub/cli push --create --force

      - name: Publish SkillHub skill
        working-directory: release-skillhub/ai8080
        run: npx -y @skill-hub/cli publish -y

      - name: Verify SkillHub release
        env:
          SKILLHUB_TOKEN: ${{ secrets.SKILLHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
            import fs from 'node:fs';

            const apiRoot = 'https://www.skillhub.club/api';
            const config = JSON.parse(fs.readFileSync('release-skillhub/ai8080/.skillhub.json', 'utf8'));
            const localContent = fs.readFileSync('release-skillhub/ai8080/SKILL.md', 'utf8');
            const releaseVersion = process.env.RELEASE_VERSION;

            const getVersion = (content) => {
              const frontmatter = content.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/);
              const versionLine = frontmatter?.[1]
                .split(/\r?\n/)
                .find((line) => line.startsWith('version:'));
              return versionLine?.slice('version:'.length).trim() ?? null;
            };
            const normalize = (content) => content.replace(/\r\n/g, '\n').trimEnd();
            const request = async (endpoint) => {
              const response = await fetch(apiRoot + endpoint, {
                headers: { Authorization: `Bearer ${process.env.SKILLHUB_TOKEN}` }
              });

              if (!response.ok) {
                throw new Error(`SkillHub ${endpoint} returned HTTP ${response.status}.`);
              }

              return response.json();
            };

            const { skills = [] } = await request('/user/skills');
            const skill = skills.find((entry) => (
              entry.id === config.skill_id ||
              entry.name?.toLowerCase() === config.name.toLowerCase() ||
              entry.slug?.toLowerCase() === config.name.toLowerCase()
            ));

            if (!skill) {
              throw new Error(`SkillHub skill "${config.name}" was not found after publishing.`);
            }

            const { versions = [] } = await request(`/user/skills/${encodeURIComponent(skill.id)}/versions`);
            let publishedContent = null;

            for (const remoteVersion of versions) {
              const pulled = await request(
                `/user/skills/${encodeURIComponent(skill.id)}/pull?version=${encodeURIComponent(remoteVersion.version)}`
              );
              const skillFile = pulled.files?.find((file) => file.filepath === 'SKILL.md');

              if (skillFile && getVersion(skillFile.content) === releaseVersion) {
                publishedContent = skillFile.content;
                break;
              }
            }

            if (!publishedContent) {
              throw new Error(`SkillHub semantic version ${releaseVersion} was not found after publishing.`);
            }

            if (normalize(publishedContent) !== normalize(localContent)) {
              throw new Error(`SkillHub semantic version ${releaseVersion} does not match the release candidate.`);
            }

            if (skill.status !== 'published') {
              throw new Error(`SkillHub skill ${skill.slug} is ${skill.status}, not published.`);
            }

            console.log(`Verified SkillHub ${skill.slug} semantic version ${releaseVersion}.`);
          NODE

      - name: Create git tag
        if: steps.tag.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.release.outputs.tag }}" "${{ steps.release.outputs.commit_sha }}"
          git push origin "${{ steps.release.outputs.tag }}"

      - name: Create GitHub release
        if: steps.github-release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/release-candidate/${{ steps.release.outputs.clawhub_package }}
            ${{ runner.temp }}/release-candidate/${{ steps.release.outputs.skillhub_package }}

      - name: Confirm release
        run: |
          echo "✅ ClawHub contains 8080ai ${{ steps.release.outputs.version }}."
          echo "✅ SkillHub contains ai8080 ${{ steps.release.outputs.version }}."
          echo "✅ Git tag and GitHub Release ${{ steps.release.outputs.tag }} are available."
