# ===========================================================================
# Publish — Runs after develop is merged into main
# ===========================================================================
name: Publish to ClawHub

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: read

# Only one publish at a time
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Publish to ClawHub
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
  
    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ── 2. Setup Node.js ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. Install dependencies ───────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build plugin ──────────────────────────────────────────────
      - name: Build plugin
        run: npm run build

      # ── 5. Validate build output ─────────────────────────────────────
      - name: Validate build output
        run: |
          test -f dist/index.js || { echo "❌ Build failed — dist/index.js missing"; exit 1; }
          echo "✅ Build output verified"

      # ── 5b. Validate package files array ─────────────────────────────
      - name: Validate package files
        run: |
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            const files = pkg.files || [];
            let missing = [];
            for (const f of files) {
              if (!fs.existsSync(f)) missing.push(f);
            }
            if (missing.length > 0) {
              console.error('❌ Missing files listed in package.json files array:');
              missing.forEach(f => console.error('   -', f));
              process.exit(1);
            }
            console.log('✅ All package files verified for publish');
          "

      # ── 6. Extract package version ───────────────────────────────────
      - name: Extract package version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          COMMIT_SHA=$(git rev-parse HEAD)

          node -e "
            const version = require('./package.json').version;
            if (!/^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$/.test(version)) {
              console.error('❌ package.json version must be valid semver');
              process.exit(1);
            }
          "

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "📦 Publishing version: $VERSION"
          echo "🏷️ Release tag: $TAG"

      # ── 7. Ensure version tag is available ───────────────────────────
      - name: Ensure version tag does not already exist
        run: |
          git fetch --tags

          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "❌ Tag ${{ steps.version.outputs.tag }} already exists. This version was already released."
            exit 1
          fi

          echo "✅ Tag ${{ steps.version.outputs.tag }} is available"

      # ── 8. Install ClawHub CLI ────────────────────────────────────────
      - name: Install ClawHub CLI
        run: npm install -g clawhub

      # ── 9. Authenticate to ClawHub ────────────────────────────────────
      - name: Authenticate to ClawHub
        run: clawhub login --token "${{ secrets.CLAWHUB_TOKEN }}" --no-browser
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      # ── 10. Verify authentication ────────────────────────────────────
      - name: Verify ClawHub authentication
        run: clawhub whoami

      # ── 11. Create git tag ───────────────────────────────────────────
      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "${{ steps.version.outputs.tag }}" "${{ steps.version.outputs.commit_sha }}"
          git push origin "${{ steps.version.outputs.tag }}"

      # ── 12. Publish to ClawHub (dry-run first) ───────────────────────
      - name: Publish to ClawHub (dry-run)
        run: |
          clawhub package publish . \
            --family code-plugin \
            --version "${{ steps.version.outputs.version }}" \
            --source-repo "${{ github.repository }}" \
            --source-commit "${{ steps.version.outputs.commit_sha }}" \
            --source-ref "${{ steps.version.outputs.tag }}" \
            --dry-run

      # ── 13. Publish to ClawHub (actual) ──────────────────────────────
      - name: Publish to ClawHub
        run: |
          clawhub package publish . \
            --family code-plugin \
            --version "${{ steps.version.outputs.version }}" \
            --source-repo "${{ github.repository }}" \
            --source-commit "${{ steps.version.outputs.commit_sha }}" \
            --source-ref "${{ steps.version.outputs.tag }}"

      # ── 14. Create GitHub release ────────────────────────────────────
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true

      # ── 15. Confirm publish ──────────────────────────────────────────
      - name: Confirm publish
        run: |
          echo "✅ Successfully published 8080ai v${{ steps.version.outputs.version }} to ClawHub"
          echo "✅ Created GitHub release ${{ steps.version.outputs.tag }}"
          echo ""
          echo "Users can now install with:"
          echo "  openclaw plugins install clawhub:8080ai"

