# ===========================================================================
# Publish — Runs after develop is merged into main
# ===========================================================================
name: Publish to ClawHub

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Branch, tag, or commit to publish
        required: true
        default: main
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: read

# Only one publish at a time
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Publish to ClawHub
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop')
    runs-on: ubuntu-latest
  
    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || 'main' }}
          fetch-depth: 0

      # ── 2. Setup Node.js ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ── 3. Install dependencies ───────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build plugin ──────────────────────────────────────────────
      - name: Build plugin
        run: npm run build

      # ── 5. Validate build output ─────────────────────────────────────
      - name: Validate build output
        run: |
          test -f dist/index.js || { echo "❌ Build failed — dist/index.js missing"; exit 1; }
          echo "✅ Build output verified"

      # ── 5b. Validate package files array ─────────────────────────────
      - name: Validate package files
        run: |
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            const files = pkg.files || [];
            let missing = [];
            for (const f of files) {
              if (!fs.existsSync(f)) missing.push(f);
            }
            if (missing.length > 0) {
              console.error('❌ Missing files listed in package.json files array:');
              missing.forEach(f => console.error('   -', f));
              process.exit(1);
            }
            console.log('✅ All package files verified for publish');
          "

      # ── 6. Extract package version ───────────────────────────────────
      - name: Extract package version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          COMMIT_SHA=$(git rev-parse HEAD)

          node -e "
            const version = require('./package.json').version;
            if (!/^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$/.test(version)) {
              console.error('❌ package.json version must be valid semver');
              process.exit(1);
            }
          "

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "📦 Publishing version: $VERSION"
          echo "🏷️ Release tag: $TAG"

      # ── 7. Ensure version tag is available ───────────────────────────
      - name: Validate version tag
        id: tag
        run: |
          git fetch --tags

          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "${{ steps.version.outputs.tag }}")

            if [ "$TAG_COMMIT" != "${{ steps.version.outputs.commit_sha }}" ]; then
              echo "❌ Tag ${{ steps.version.outputs.tag }} points to $TAG_COMMIT, not ${{ steps.version.outputs.commit_sha }}."
              exit 1
            fi

            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ Tag ${{ steps.version.outputs.tag }} already points to the selected release commit"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "✅ Tag ${{ steps.version.outputs.tag }} is available"
          fi

      # ── 8. Create package tarball ────────────────────────────────────
      - name: Create package tarball
        id: package
        run: |
          mkdir -p package
          TARBALL=$(npm pack --pack-destination package | tail -n 1)
          TARBALL_PATH="$(pwd)/package/$TARBALL"

          test -f "$TARBALL_PATH" || { echo "❌ Tarball was not created"; exit 1; }

          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "tarball_path=$TARBALL_PATH" >> "$GITHUB_OUTPUT"
          echo "✅ Created tarball: $TARBALL_PATH"

      # ── 9. Upload package tarball artifact ───────────────────────────
      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: ${{ steps.package.outputs.tarball_path }}
          if-no-files-found: error

      # ── 10. Install ClawHub CLI ───────────────────────────────────────
      - name: Install ClawHub CLI
        run: npm install -g clawhub

      # ── 11. Authenticate to ClawHub ───────────────────────────────────
      - name: Authenticate to ClawHub
        run: clawhub login --token "${{ secrets.CLAWHUB_TOKEN }}" --no-browser
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      # ── 12. Verify authentication ────────────────────────────────────
      - name: Verify ClawHub authentication
        run: clawhub whoami

      - name: Check ClawHub release
        id: clawhub-release
        run: |
          LOOKUP_OUTPUT=$(mktemp)

          if clawhub package inspect 8080ai --version "${{ steps.version.outputs.version }}" --json > "$LOOKUP_OUTPUT" 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ ClawHub version ${{ steps.version.outputs.version }} already exists"
          elif grep -q "Version not found" "$LOOKUP_OUTPUT"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ ClawHub version ${{ steps.version.outputs.version }} is not published yet"
          else
            cat "$LOOKUP_OUTPUT"
            echo "❌ Unable to determine ClawHub release status"
            exit 1
          fi

      # ── 13. Publish to ClawHub (dry-run first) ───────────────────────
      - name: Publish to ClawHub (dry-run)
        if: steps.clawhub-release.outputs.exists != 'true'
        run: |
          clawhub package publish "${{ steps.package.outputs.tarball_path }}" \
            --family code-plugin \
            --version "${{ steps.version.outputs.version }}" \
            --source-repo "${{ github.repository }}" \
            --source-commit "${{ steps.version.outputs.commit_sha }}" \
            --source-ref "${{ steps.version.outputs.tag }}" \
            --dry-run

      # ── 14. Publish to ClawHub (actual) ──────────────────────────────
      - name: Publish to ClawHub
        if: steps.clawhub-release.outputs.exists != 'true'
        run: |
          clawhub package publish "${{ steps.package.outputs.tarball_path }}" \
            --family code-plugin \
            --version "${{ steps.version.outputs.version }}" \
            --source-repo "${{ github.repository }}" \
            --source-commit "${{ steps.version.outputs.commit_sha }}" \
            --source-ref "${{ steps.version.outputs.tag }}"

      - name: Verify ClawHub release
        run: |
          for ATTEMPT in 1 2 3 4 5 6; do
            if clawhub package inspect 8080ai --version "${{ steps.version.outputs.version }}" --json >/dev/null 2>&1; then
              echo "✅ Verified ClawHub version ${{ steps.version.outputs.version }}"
              exit 0
            fi

            echo "Waiting for ClawHub version ${{ steps.version.outputs.version }} (attempt $ATTEMPT/6)"
            sleep 10
          done

          echo "❌ ClawHub version ${{ steps.version.outputs.version }} was not found after publishing"
          exit 1

      # ── 15. Create git tag ───────────────────────────────────────────
      - name: Create git tag
        if: steps.tag.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "${{ steps.version.outputs.tag }}" "${{ steps.version.outputs.commit_sha }}"
          git push origin "${{ steps.version.outputs.tag }}"

      # ── 16. Create GitHub release ────────────────────────────────────
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.tarball_path }}

      # ── 17. Confirm publish ──────────────────────────────────────────
      - name: Confirm publish
        run: |
          echo "✅ ClawHub contains 8080ai v${{ steps.version.outputs.version }}"
          echo "✅ Created package tarball ${{ steps.package.outputs.tarball }}"
          echo "✅ GitHub release ${{ steps.version.outputs.tag }} is available"
          echo ""
          echo "Users can now install with:"
          echo "  openclaw plugins install clawhub:8080ai"
