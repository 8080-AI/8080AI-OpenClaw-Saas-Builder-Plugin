# ===========================================================================
# Publish SkillHub Skill
# ===========================================================================
name: Publish to SkillHub

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish to ClawHub"]
    types: [completed]

concurrency:
  group: publish-skillhub-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-skillhub:
    name: Publish ai8080 SkillHub skill
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Extract package version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          COMMIT_SHA=$(git rev-parse HEAD)

          node -e "
            const version = require('./package.json').version;
            if (!/^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$/.test(version)) {
              console.error('❌ package.json version must be valid semver');
              process.exit(1);
            }
          "

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "📦 Publishing SkillHub version: $VERSION"
          echo "🏷️ Release tag: $TAG"

      - name: Sync SkillHub skill version
        run: |
          VERSION="${{ steps.version.outputs.version }}" node -e "
            const fs = require('fs');
            const path = 'skillhub/ai8080/SKILL.md';
            const version = process.env.VERSION;
            const content = fs.readFileSync(path, 'utf8');
            const match = content.match(/^---\\n([\\s\\S]*?)\\n---\\n/);

            if (!match) {
              console.error('❌ SKILL.md must start with YAML frontmatter');
              process.exit(1);
            }

            const frontmatter = match[1].split('\\n');
            const versionLine = 'version: ' + version;
            const versionIndex = frontmatter.findIndex((line) => line.startsWith('version:'));

            if (versionIndex >= 0) {
              frontmatter[versionIndex] = versionLine;
            } else {
              const descriptionIndex = frontmatter.findIndex((line) => line.startsWith('description:'));
              frontmatter.splice(descriptionIndex >= 0 ? descriptionIndex + 1 : frontmatter.length, 0, versionLine);
            }

            fs.writeFileSync(path, '---\\n' + frontmatter.join('\\n') + '\\n---\\n' + content.slice(match[0].length));
          "

      - name: Validate SkillHub skill
        run: |
          test -f skillhub/ai8080/SKILL.md
          test -f skillhub/ai8080/.skillhub.json
          grep -q "^name:" skillhub/ai8080/SKILL.md
          grep -q "^description:" skillhub/ai8080/SKILL.md
          grep -q "^version: ${{ steps.version.outputs.version }}$" skillhub/ai8080/SKILL.md
          grep -q "openclaw plugins install clawhub:8080ai" skillhub/ai8080/SKILL.md

      - name: Package SkillHub skill
        id: package
        run: |
          mkdir -p skillhub-dist
          cd skillhub
          ZIP_NAME="ai8080-skill-v${{ steps.version.outputs.version }}.zip"
          zip -r "../skillhub-dist/$ZIP_NAME" ai8080
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_path=skillhub-dist/$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload SkillHub package artifact
        uses: actions/upload-artifact@v4
        with:
          name: skillhub-ai8080-v${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error

      - name: Configure SkillHub token
        run: |
          mkdir -p "$HOME/.skillhub"
          node -e "
            const fs = require('fs');
            const authPath = process.env.HOME + '/.skillhub/auth.json';
            const auth = {
              accessToken: process.env.SKILLHUB_TOKEN,
              user: {
                username: 'github-actions',
                email: '',
                tier: 'standard'
              }
            };
            fs.writeFileSync(authPath, JSON.stringify(auth, null, 2), { mode: 0o600 });
          "
        env:
          SKILLHUB_TOKEN: ${{ secrets.SKILLHUB_TOKEN }}

      - name: Verify SkillHub authentication
        run: npx -y @skill-hub/cli whoami

      - name: Link existing SkillHub skill
        working-directory: skillhub/ai8080
        env:
          SKILLHUB_TOKEN: ${{ secrets.SKILLHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
            import fs from 'node:fs';

            const configPath = '.skillhub.json';
            const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));

            if (config.skill_id) {
              console.log(`Already linked to SkillHub skill ${config.skill_id}`);
              process.exit(0);
            }

            const response = await fetch('https://www.skillhub.club/api/user/skills', {
              headers: {
                Authorization: `Bearer ${process.env.SKILLHUB_TOKEN}`
              }
            });

            if (!response.ok) {
              throw new Error(`Unable to list SkillHub skills: HTTP ${response.status}`);
            }

            const { skills = [] } = await response.json();
            const matches = skills.filter((skill) => (
              skill.name?.toLowerCase() === config.name.toLowerCase() ||
              skill.slug?.toLowerCase() === config.name.toLowerCase()
            ));

            if (matches.length > 1) {
              throw new Error(`Multiple SkillHub skills match "${config.name}"; add skill_id to .skillhub.json explicitly.`);
            }

            if (matches.length === 0) {
              console.log(`No existing SkillHub skill named "${config.name}"; push will create it.`);
              process.exit(0);
            }

            const skill = matches[0];
            fs.writeFileSync(configPath, JSON.stringify({
              ...config,
              skill_id: skill.id,
              slug: skill.slug
            }, null, 2));
            console.log(`Linked existing SkillHub skill ${skill.slug} (${skill.id}).`);
          NODE

      - name: Push SkillHub skill
        working-directory: skillhub/ai8080
        run: npx -y @skill-hub/cli push --create --force

      - name: Publish SkillHub skill
        working-directory: skillhub/ai8080
        run: npx -y @skill-hub/cli publish -y

      - name: Confirm SkillHub publish
        run: |
          echo "✅ Successfully published ai8080 v${{ steps.version.outputs.version }} to SkillHub"
          echo "✅ Uploaded SkillHub artifact ${{ steps.package.outputs.zip_name }}"
          echo "✅ Matched ClawHub release tag ${{ steps.version.outputs.tag }}"
