  # ===========================================================================
  # CI — Runs on every Pull Request to validate the build
  # ===========================================================================
  name: CI

  on:
    pull_request:
      branches: [main]

  # Cancel previous runs for the same PR when new commits are pushed
  concurrency:
    group: ci-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

  jobs:
    build:
      name: Build & Validate
      runs-on: ubuntu-latest

      steps:
        # ── 1. Checkout code ──────────────────────────────────────────────
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        # ── 2. Validate package version ──────────────────────────────────
        - name: Validate package version policy
          env:
            BASE_SHA: ${{ github.event.pull_request.base.sha }}
            HEAD_SHA: ${{ github.event.pull_request.head.sha }}
            TARGET_BRANCH: ${{ github.base_ref }}
          run: |
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"

            echo "Checking package version: $VERSION"

            node -e "
              const version = require('./package.json').version;
              if (!/^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?(\\+[0-9A-Za-z.-]+)?$/.test(version)) {
                console.error('❌ package.json version must be valid semver');
                process.exit(1);
              }
            "

            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            NON_WORKFLOW_FILES=$(printf '%s\n' "$CHANGED_FILES" | sed '/^\.github\//d' | sed '/^$/d')

            echo "Changed files:"
            printf '%s\n' "$CHANGED_FILES" | sed 's/^/  /'

            if [ -z "$NON_WORKFLOW_FILES" ]; then
              echo "✅ Workflow-only change detected; existing release version $VERSION is allowed."
              exit 0
            fi

            if [ "$TARGET_BRANCH" != "main" ]; then
              echo "✅ Package version is valid; release uniqueness is enforced when develop is promoted to main."
              exit 0
            fi

            git fetch --tags

            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "❌ Tag $TAG already exists. Update package.json version before merging."
              exit 1
            fi

            LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)

            if [ -n "$LATEST_TAG" ]; then
              CURRENT_VERSION="$VERSION" LATEST_VERSION="${LATEST_TAG#v}" node -e "
                const parse = (version) => {
                  const match = version.match(/^([0-9]+)\\.([0-9]+)\\.([0-9]+)/);
                  return match.slice(1).map(Number);
                };

                const current = parse(process.env.CURRENT_VERSION);
                const latest = parse(process.env.LATEST_VERSION);
                const isGreater = current.some((part, index) => (
                  part > latest[index] && current.slice(0, index).every((value, i) => value === latest[i])
                ));

                if (!isGreater) {
                  console.error('❌ package.json version must be greater than latest released tag v' + process.env.LATEST_VERSION);
                  process.exit(1);
                }
              "

              echo "✅ $VERSION is greater than latest released tag $LATEST_TAG"
            fi

            echo "✅ $TAG is available"

        # ── 3. Setup Node.js ──────────────────────────────────────────────
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: 'npm'
            cache-dependency-path: package-lock.json
        # ── 4. Install dependencies ───────────────────────────────────────
        - name: Install dependencies
          run: npm ci

        # ── 5. Build plugin ──────────────────────────────────────────────
        - name: Build plugin
          run: npm run build

        # ── 6. Validate build output exists ───────────────────────────────
        - name: Validate build output
          run: |
            echo "Checking dist/index.js exists..."
            test -f dist/index.js || { echo "❌ dist/index.js not found"; exit 1; }
            echo "✅ Build output verified"

        # ── 7. Validate package files array ───────────────────────────────
        # Ensures every entry in package.json "files" array exists.
        # This is the list of files/dirs that npm pack includes in the
        # tarball — if any are missing, the published plugin is broken.
        - name: Validate package files
          run: |
            node -e "
              const fs = require('fs');
              const pkg = require('./package.json');
              const files = pkg.files || [];
              let missing = [];
              for (const f of files) {
                if (!fs.existsSync(f)) missing.push(f);
              }
              if (missing.length > 0) {
                console.error('❌ Missing files listed in package.json files array:');
                missing.forEach(f => console.error('   -', f));
                process.exit(1);
              }
              console.log('✅ All package files present:');
              files.forEach(f => {
                const stat = fs.statSync(f);
                const type = stat.isDirectory() ? 'dir' : 'file';
                console.log('   ✓', f, '(' + type + ')');
              });
            "

        # ── 8. Validate plugin manifest & openclaw metadata ──────────────
        - name: Validate plugin metadata
          run: |
            echo "Checking openclaw.plugin.json..."
            test -f openclaw.plugin.json || { echo "❌ openclaw.plugin.json not found"; exit 1; }
            echo "Checking package.json openclaw metadata..."
            node -e "
              const pkg = require('./package.json');
              const oc = pkg.openclaw;
              if (!oc) { console.error('❌ Missing openclaw block'); process.exit(1); }
              if (!oc.compat?.pluginApi) { console.error('❌ Missing openclaw.compat.pluginApi'); process.exit(1); }
              if (!oc.build?.openclawVersion) { console.error('❌ Missing openclaw.build.openclawVersion'); process.exit(1); }
              console.log('✅ Plugin metadata validated');
              console.log('   pluginApi:', oc.compat.pluginApi);
              console.log('   openclawVersion:', oc.build.openclawVersion);
            "

        # ── 9. Create package tarball ────────────────────────────────────
        - name: Create package tarball
          id: package
          run: |
            mkdir -p package
            TARBALL=$(npm pack --pack-destination package | tail -n 1)
            TARBALL_PATH="package/$TARBALL"

            test -f "$TARBALL_PATH" || { echo "❌ Tarball was not created"; exit 1; }

            echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
            echo "tarball_path=$TARBALL_PATH" >> "$GITHUB_OUTPUT"
            echo "✅ Created tarball: $TARBALL_PATH"

        # ── 10. Upload package tarball artifact ──────────────────────────
        - name: Upload package tarball
          uses: actions/upload-artifact@v4
          with:
            name: package-tarball
            path: ${{ steps.package.outputs.tarball_path }}
            if-no-files-found: error
